# XcodeGen spec. Regenerate the .xcodeproj with `xcodegen generate` (scripts/bootstrap.sh does it).
# The .xcodeproj is not committed; this file is the source of truth for the Xcode project.
name: BCIWorkspace
options:
  bundleIdPrefix: com.hshwang34
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "26.2"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    # Apple Silicon only for v0.x (brief 001, decision #5): the bundled worker is arm64-only.
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    # Ad-hoc signing by default (CI overrides Debug to this too). Release signs with the
    # personal Developer ID and the hardened runtime; scripts/release.sh drives it
    # (docs/RELEASING.md).
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_APP_SANDBOX: NO
    DEAD_CODE_STRIPPING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    # Where WorkerLaunch.locate finds worker/.venv. Debug only; Release leaves it empty so a
    # shipped app can never reach outside its bundle for an interpreter.
    BCI_WORKER_DEV_ROOT: ""
    # Info.plist versions; scripts/release.sh overrides both on the command line.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    Debug:
      BCI_WORKER_DEV_ROOT: $(SRCROOT)/worker
      # A stable identity keeps the designated requirement constant across rebuilds, so macOS
      # remembers the Documents-folder grant (the repo and dev venv live under ~/Documents).
      # Ad-hoc ("-") changes the cdhash every build and re-prompts. Personal team only.
      CODE_SIGN_IDENTITY: "Apple Development"
      DEVELOPMENT_TEAM: V56DG94ZL5
    Release:
      # Developer ID distribution outside the App Store: hardened runtime, secure timestamp,
      # no get-task-allow. The bundled worker's Mach-Os are signed the same way by
      # scripts/bundle_worker.sh --sign before the copy phase embeds them. Personal team only.
      CODE_SIGN_IDENTITY: "Developer ID Application"
      DEVELOPMENT_TEAM: V56DG94ZL5
      ENABLE_HARDENED_RUNTIME: YES
      OTHER_CODE_SIGN_FLAGS: "--timestamp"
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

targets:
  BCIWorkspace:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: ["Resources/**"]
      - path: Sources
      # Pins the BrainFlow build the bridge was vendored against; tests compare it to the
      # version the dylib and the worker report at runtime.
      - path: native/brainflow/lib/VERSION
        buildPhase: resources
      # The bundled example project (brief 001): a folder reference copied verbatim into
      # Contents/Resources, read by ProjectStore.importBundledExample and nothing else.
      - path: App/Resources/ExampleProject/S001-motor-imagery.bciproj
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hshwang34.BCIWorkspace
        PRODUCT_NAME: BCIWorkspace
        # App/Assets.xcassets: colour tokens (visual spec §1.1) and the rendered icon set.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/native/brainflow/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/native/brainflow/lib
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: App/Info.plist
      properties:
        CFBundleName: BCI Workspace
        CFBundleDisplayName: BCI Workspace
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: ""
        # Development-only: lets the app find worker/.venv without bundling it. Empty in
        # Release (see BCI_WORKER_DEV_ROOT). Ignored when Contents/Resources/worker exists.
        BCIWorkerDevRoot: $(BCI_WORKER_DEV_ROOT)
        # A project is a `.bciproj` directory; declaring it a package makes Finder show it
        # as one document and lets NSDocumentController keep it in Open Recent (brief 001).
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.hshwang34.bciproj
            UTTypeDescription: BCI Workspace Project
            UTTypeConformsTo: [com.apple.package, public.composite-content]
            UTTypeTagSpecification:
              public.filename-extension: [bciproj]
        CFBundleDocumentTypes:
          - CFBundleTypeName: BCI Workspace Project
            CFBundleTypeRole: Editor
            LSHandlerRank: Default
            LSTypeIsPackage: true
            LSItemContentTypes: [com.hshwang34.bciproj]
        # Brief 008: `bci enable` opens bciworkspace://enable-control; the app asks first.
        CFBundleURLTypes:
          - CFBundleURLName: com.hshwang34.BCIWorkspace.control
            CFBundleURLSchemes: [bciworkspace]
    dependencies:
      - framework: native/brainflow/lib/libBoardController.dylib
        embed: true
        codeSign: true
      # Brief 008 / decision #52: the agent command-line tool, signed with the app.
      - target: bci
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    postCompileScripts:
      - name: Copy bundled worker if built
        # scripts/bundle_worker.sh produces build/worker-dist; skip the rsync when nothing under
        # it changed since the last copy (stamp). When it is absent (dev builds), remove any
        # copy an earlier build left, so the app falls back to the dev venv as tests expect.
        script: |
          SRC="$SRCROOT/build/worker-dist"
          DST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/worker"
          STAMP="$DERIVED_FILE_DIR/worker-dist.stamp"
          if [ -d "$SRC" ]; then
            mkdir -p "$DERIVED_FILE_DIR"
            if [ ! -f "$STAMP" ] || [ ! -d "$DST" ] || [ -n "$(find "$SRC" -newer "$STAMP" -print -quit)" ]; then
              rsync -a --delete "$SRC/" "$DST/"
              touch "$STAMP"
            fi
          elif [ -d "$DST" ]; then
            rm -rf "$DST" "$STAMP"
          fi
        basedOnDependencyAnalysis: false
      - name: Generate and copy the Demo playback file
        # Decision #42: the bundled example's run S001R04 as a Cyton+Daisy playback CSV plus
        # its provenance sidecar (worker/tools/make_demo_playback.py; ~2.3 MB, never committed).
        # Regenerated only when an input is newer than the stamp (the tool also rewrites a file
        # only on change). If it can't be regenerated (no uv, or the tool failed), nothing
        # stale is copied: the app's Demo/ is removed and the sheet shows the Demo as
        # unavailable. A missing input is a broken checkout and fails the build.
        # scripts/release.sh generates it up front and requires it.
        script: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$HOME/.local/bin:$PATH"
          OUT="$SRCROOT/build/demo"
          DST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Demo"
          STAMP="$OUT/.inputs.stamp"
          TOOL="$SRCROOT/worker/tools/make_demo_playback.py"
          LOCK="$SRCROOT/worker/uv.lock"
          IO="$SRCROOT/worker/src/bciworkspace_worker/project_io.py"
          EXAMPLE="$SRCROOT/App/Resources/ExampleProject"
          FRESH=0
          if [ -f "$STAMP" ]; then
            if ! CHANGED="$(find "$TOOL" "$LOCK" "$IO" "$EXAMPLE" -newer "$STAMP" -print -quit)"; then
              echo "error: Demo inputs missing or unreadable (find failed); is the checkout complete?"
              exit 1
            fi
            [ -z "$CHANGED" ] && FRESH=1
          fi
          if [ "$FRESH" = 0 ]; then
            if command -v uv >/dev/null && (cd "$SRCROOT/worker" && uv run --frozen python tools/make_demo_playback.py --out "$OUT"); then
              touch "$STAMP"
              FRESH=1
            else
              echo "warning: Demo playback file not generated (needs uv: brew install uv). The Demo source is unavailable in this build; no stale copy is bundled."
            fi
          fi
          if [ "$FRESH" = 1 ]; then
            mkdir -p "$DST"
            rsync -a --delete --exclude '.*' "$OUT/" "$DST/"
          else
            rm -rf "$DST"
          fi
        basedOnDependencyAnalysis: false

  # Crash-injection helper for the store tests: commits chunks and _exit()s at a named
  # commit point (CRASH_AT=<point>:<n>). Built with the store sources only; no app, no worker.
  BCIStoreCrashHelper:
    type: tool
    platform: macOS
    sources:
      - path: Sources/Contracts
      - path: Sources/ProjectStore
      - path: Tools/BCIStoreCrashHelper
    settings:
      base:
        PRODUCT_NAME: BCIStoreCrashHelper

  # Brief 008: `bci`, the thin client coding agents use (CLI + `bci mcp`). Only the shared
  # control protocol; every command runs in the app over its local socket.
  bci:
    type: tool
    platform: macOS
    sources:
      - path: Sources/Control
      - path: Tools/bci
    settings:
      base:
        PRODUCT_NAME: bci
        PRODUCT_BUNDLE_IDENTIFIER: com.hshwang34.BCIWorkspace.bci

  BCIWorkspaceTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
        excludes: ["Fixtures/**"]
      - path: Tests/Fixtures/tiny.bciproj
        type: folder
        buildPhase: resources
      # inspect_recording results captured from the worker (worker/tools/make_quality_fixtures.py).
      - path: Tests/Fixtures/inspect_recording_tiny.json
        buildPhase: resources
      - path: Tests/Fixtures/inspect_recording_faults.json
        buildPhase: resources
      # signal_window results, from the same tool.
      - path: Tests/Fixtures/signal_window_tiny.json
        buildPhase: resources
      - path: Tests/Fixtures/signal_window_low_rate.json
        buildPhase: resources
      # BrainFlow playback-file CSV with injected counter faults (worker/tools/make_playback_fixture.py).
      - path: Tests/Fixtures/playback_cyton_daisy_faults.csv
        buildPhase: resources
      # CONSTRUCTED, not captured from a board: the Cyton+Daisy `?` reply as the firmware
      # source prints it (OpenBCI_Cyton_Library printAllRegisters / RREGS), default registers.
      - path: Tests/Fixtures/cyton_daisy_register_dump.constructed.txt
        buildPhase: resources
    dependencies:
      - target: BCIWorkspace
      - target: BCIStoreCrashHelper
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hshwang34.BCIWorkspaceTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/native/brainflow/include

schemes:
  BCIWorkspace:
    build:
      targets:
        BCIWorkspace: all
        BCIWorkspaceTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BCIWorkspaceTests
