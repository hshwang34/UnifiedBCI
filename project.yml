# XcodeGen spec. Regenerate the .xcodeproj with `xcodegen generate` (scripts/bootstrap.sh does it).
# The .xcodeproj is not committed; this file is the source of truth for the Xcode project.
name: BCIWorkspace
options:
  bundleIdPrefix: com.hshwang34
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "26.2"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    # Apple Silicon only for v0.x (brief 001, decision #5): the bundled worker is arm64-only.
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    # Ad-hoc signing for local development. Release builds use a Developer ID identity
    # and must re-enable hardened runtime (see docs/adr/0002-native-boundary.md).
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_APP_SANDBOX: NO
    DEAD_CODE_STRIPPING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    # Where WorkerLaunch.locate finds worker/.venv. Debug only; Release leaves it empty so a
    # shipped app can never reach outside its bundle for an interpreter.
    BCI_WORKER_DEV_ROOT: ""
  configs:
    Debug:
      BCI_WORKER_DEV_ROOT: $(SRCROOT)/worker
      # A stable identity keeps the designated requirement constant across rebuilds, so macOS
      # remembers the Documents-folder grant (the repo and dev venv live under ~/Documents).
      # Ad-hoc ("-") changes the cdhash every build and re-prompts. Personal team only.
      CODE_SIGN_IDENTITY: "Apple Development"
      DEVELOPMENT_TEAM: V56DG94ZL5

targets:
  BCIWorkspace:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: ["Resources/**"]
      - path: Sources
      # Pins the BrainFlow build the bridge was vendored against; tests compare it to the
      # version the dylib and the worker report at runtime.
      - path: native/brainflow/lib/VERSION
        buildPhase: resources
      # The bundled example project (brief 001): a folder reference copied verbatim into
      # Contents/Resources, read by ProjectStore.importBundledExample and nothing else.
      - path: App/Resources/ExampleProject/S001-motor-imagery.bciproj
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hshwang34.BCIWorkspace
        PRODUCT_NAME: BCIWorkspace
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/native/brainflow/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/native/brainflow/lib
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: App/Info.plist
      properties:
        CFBundleName: BCI Workspace
        CFBundleDisplayName: BCI Workspace
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: ""
        # Development-only: lets the app find worker/.venv without bundling it. Empty in
        # Release (see BCI_WORKER_DEV_ROOT). Ignored when Contents/Resources/worker exists.
        BCIWorkerDevRoot: $(BCI_WORKER_DEV_ROOT)
        # A project is a `.bciproj` directory; declaring it a package makes Finder show it
        # as one document and lets NSDocumentController keep it in Open Recent (brief 001).
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.hshwang34.bciproj
            UTTypeDescription: BCI Workspace Project
            UTTypeConformsTo: [com.apple.package, public.composite-content]
            UTTypeTagSpecification:
              public.filename-extension: [bciproj]
        CFBundleDocumentTypes:
          - CFBundleTypeName: BCI Workspace Project
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSTypeIsPackage: true
            LSItemContentTypes: [com.hshwang34.bciproj]
    dependencies:
      - framework: native/brainflow/lib/libBoardController.dylib
        embed: true
        codeSign: true
    postCompileScripts:
      - name: Copy bundled worker if built
        # scripts/bundle_worker.sh produces build/worker-dist; skip silently when absent (dev
        # builds) and skip the rsync when nothing under it changed since the last copy (stamp).
        script: |
          SRC="$SRCROOT/build/worker-dist"
          DST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/worker"
          STAMP="$DERIVED_FILE_DIR/worker-dist.stamp"
          if [ -d "$SRC" ]; then
            mkdir -p "$DERIVED_FILE_DIR"
            if [ ! -f "$STAMP" ] || [ ! -d "$DST" ] || [ -n "$(find "$SRC" -newer "$STAMP" -print -quit)" ]; then
              rsync -a --delete "$SRC/" "$DST/"
              touch "$STAMP"
            fi
          fi
        basedOnDependencyAnalysis: false

  # Crash-injection helper for the store tests: commits chunks and _exit()s at a named
  # commit point (CRASH_AT=<point>:<n>). Built with the store sources only; no app, no worker.
  BCIStoreCrashHelper:
    type: tool
    platform: macOS
    sources:
      - path: Sources/Contracts
      - path: Sources/ProjectStore
      - path: Tools/BCIStoreCrashHelper
    settings:
      base:
        PRODUCT_NAME: BCIStoreCrashHelper

  BCIWorkspaceTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
        excludes: ["Fixtures/**"]
      - path: Tests/Fixtures/tiny.bciproj
        type: folder
        buildPhase: resources
    dependencies:
      - target: BCIWorkspace
      - target: BCIStoreCrashHelper
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hshwang34.BCIWorkspaceTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/native/brainflow/include

schemes:
  BCIWorkspace:
    build:
      targets:
        BCIWorkspace: all
        BCIWorkspaceTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BCIWorkspaceTests
