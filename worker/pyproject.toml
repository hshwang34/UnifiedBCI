[project]
name = "bciworkspace-worker"
version = "0.1.0"
description = "Isolated analysis worker for BCI Workspace: fit / evaluate / replay the reference CSP+rLDA pipeline over a versioned local IPC protocol."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0,<3",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "threadpoolctl>=3",
    "brainflow>=5.12",
]

[project.scripts]
bciworkspace-worker = "bciworkspace_worker.main:main"

[dependency-groups]
# MNE is a test oracle only (CSP parity); it never ships in the bundled worker.
dev = ["pytest>=8", "mne>=1.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bciworkspace_worker"]

[tool.pytest.ini_options]
markers = ["slow: runs the full bundled S001 example (seconds, not milliseconds)"]
