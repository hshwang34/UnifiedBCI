[project]
name = "bciworkspace-worker"
version = "0.1.0"
description = "Isolated analysis worker for BCI Workspace: fit / evaluate / replay the reference CSP+rLDA pipeline over a versioned local IPC protocol."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0,<3",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "mne>=1.8",
    "brainflow>=5.12",
]

[project.scripts]
bciworkspace-worker = "bciworkspace_worker.main:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bciworkspace_worker"]
